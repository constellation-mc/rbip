modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/constellation-mc/rbip/issues"
clientSideOnly = true

[[mods]]
modId = "rbip"
version = "${version}"
displayName = "Recipe Book Is Pain"
logoFile = "assets/rbip/icon.png"
authors = "zenfyr"
description = '''Makes the recipe book use creative tabs for groups'''
displayTest = "IGNORE_ALL_VERSION"

[[mixins]]
config = "rbip.mixins.json"

[[dependencies.rbip]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.rbip]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version},]"
ordering = "NONE"
side = "BOTH"
