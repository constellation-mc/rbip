import me.modmuss50.mpp.ReleaseType

plugins {
    alias libs.plugins.neoforge.legacyforge
    id 'maven-publish'
    alias libs.plugins.lombok
    alias libs.plugins.spotless
    alias libs.plugins.modmuss50.publish
}

def targetJavaVersion = Integer.parseInt(java_version)
def local = !System.getenv().containsKey("GITHUB_RUN_NUMBER")

version = "${mod_version}+mc${minecraft_version}"
group = project.maven_group

base {
    archivesName = "${project.mod_id}-${loader_id}"
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'ParchmentMC'
                url = 'https://maven.parchmentmc.org'
            }
        }
        filter { includeGroup('org.parchmentmc.data') }
    }
    mavenCentral()
}

mixin {
    add(sourceSets.main, "${mod_id}.refmap.json")

    config("${mod_id}.mixins.json")
}

legacyForge {
    version = "${minecraft_version}-${libs.forge.get().version}"

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    runs {
        server {
            server()
            gameDirectory = file("run/server")
            loadedMods = [mods."${mod_id}"]
        }
        client {
            client()
            gameDirectory = file("run/client")
            loadedMods = [mods."${mod_id}"]
        }
    }
}

dependencies {
    var mixin = libs.mixin.asProvider().get()
    annotationProcessor("${mixin.group}:${mixin.name}:${mixin.version}:processor")

    annotationProcessor(libs.mixin.extras.common)
    compileOnly(libs.mixin.extras.common)
    jarJar(libs.mixin.extras.forge)
    implementation(libs.mixin.extras.forge)
}

spotless {
    java {
        removeUnusedImports()
        palantirJavaFormat('2.91.0').style("GOOGLE")
        trimTrailingWhitespace()
        formatAnnotations()
    }
}

processResources {
    def map = [
            "version": project.version,
            "mod_id": mod_id,
            "minecraft_version": minecraft_version,
            "forge_version": libs.forge.get().version
    ]
    inputs.properties(map)
    filteringCharset "UTF-8"

    filesMatching(["META-INF/mods.toml"]) {
        expand map
    }
}

tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release = targetJavaVersion
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${mod_id}" }
    }
    finalizedBy('reobfJar')
    manifest.attributes([
            "MixinConfigs": "${mod_id}.mixins.json"
    ])
}

// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = "${mod_id}-${loader_id}"
            version = "${mod_version}+mc${minecraft_version}"
            from components.java
        }
    }
}

publishMods {
    file = jar.archiveFile
    version = "${mod_version}+mc${minecraft_version}+${loader_id}"

    changelog = file("CHANGELOG.md").text
    type = ReleaseType.valueOf(providers.environmentVariable("VERSION_TYPE").getOrElse("BETA"))
    modLoaders.add(loader_id)

    displayName = "${project.mod_version} (${project.minecraft_version})"

    modrinth {
        projectId = "etNS9OnA"
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        minecraftVersions.add("${project.minecraft_version}")
        environment = CLIENT_ONLY
    }
    curseforge {
        projectId = "643246"
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        minecraftVersions.add("${project.minecraft_version}")
        client = true
        server = false
    }
    github {
        repository = "constellation-mc/rbip"
        accessToken = providers.environmentVariable("GITHUB_TOKEN")
        commitish = providers.environmentVariable("GITHUB_SHA").getOrElse("${project.minecraft_version}-${loader_id}")

        type = STABLE
    }

    dryRun = local
}
